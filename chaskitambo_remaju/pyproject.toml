[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaskitambo-remaju"
version = "0.1.5"
description = "Plugin autónomo de raspado REMAJU para el motorizador Chaskitambo"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "chaskitambo",
    "playwright>=1.40.0",
    "ddddocr>=1.5.0",
    "pydantic>=2.0"
]

[project.entry-points."chaskitambo.plugins"]
remaju = "chaskitambo_remaju.scraper:RemajuScraper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chaskitambo_remaju = ["*.json"]